ily="Arial,sans-serif" font-size="14" fill="#777b91">Present today</text><text x="504" y="258" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#16856a">42</text><text x="716" y="211" font-family="Arial,sans-serif" font-size="14" fill="#777b91">Reports to review</text><text x="716" y="258" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#d17a22">3</text></g><rect x="272" y="316" width="650" height="288" rx="16" fill="#fff"/><text x="296" y="354" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#25263d">Recent daily reports</text><g font-family="Arial,sans-serif" font-size="14"><text x="296" y="399" fill="#33364d">Sunflower group</text><text x="296" y="422" fill="#898ca0">Lunch and nap time completed</text><rect x="782" y="385" width="112" height="28" rx="14" fill="#e1f6ed"/><text x="800" y="404" fill="#16856a">Submitted</text><path d="M296 444H898" stroke="#ececf3"/><text x="296" y="475" fill="#33364d">Rainbow group</text><text x="296" y="498" fill="#898ca0">Outdoor play and activities</text><rect x="782" y="461" width="112" height="28" rx="14" fill="#e1f6ed"/><text x="800" y="480" fill="#16856a">Submitted</text><path d="M296 520H898" stroke="#ececf3"/><text x="296" y="551" fill="#33364d">Little Stars</text><text x="296" y="574" fill="#898ca0">Daily report needs review</text><rect x="782" y="537" width="112" height="28" rx="14" fill="#fff0d9"/><text x="803" y="556" fill="#b56b17">Pending</text></g></svg>
